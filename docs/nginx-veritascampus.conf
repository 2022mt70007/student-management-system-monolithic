# Nginx config for veritascampus.page (monolith)
# Place on VM: /etc/nginx/sites-available/veritascampus
# Frontend build: leave VITE_API_BASE_URL empty so /api uses same origin.

server {
    listen 80;
    server_name veritascampus.page www.veritascampus.page;

    root /var/www/veritascampus;
    index index.html;

    # API → monolith Docker (port 8090)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger (optional)
    location /swagger-ui.html {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    location /v3/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: after DNS points to this VM, run:
# sudo certbot --nginx -d veritascampus.page -d www.veritascampus.page
#
# Coexists on same VM as veritascampus.me — nginx uses server_name to route each domain.
